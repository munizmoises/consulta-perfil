<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Perfil</title>
  <meta name="description" content="Sistema para consultar substituições de perfis de alumínio, acessórios e componentes da Perfil Alumínio do Brasil.">
  <meta property="og:title" content="Consulta Perfil - Perfil Alumínio do Brasil">
  <meta property="og:description" content="Consulte substituições de perfis de alumínio, acessórios e componentes de forma rápida.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://munizmoises.github.io/consulta-perfil/">
  <meta property="og:image" content="https://munizmoises.github.io/consulta-perfil/assets/img/favicon.png">
  <meta property="og:image:type" content="image/png">

  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="barra">
    <div class="barra-marca">
      <span class="logo">C</span>
      <span>Consulta Perfil</span>
      <nav class="barra-nav">
        <a href="index.html" class="nav-link nav-link-ativo">Substituições</a>
        <a href="catalogo.html" class="nav-link">Catálogo (EM TESTES)</a>
      </nav>
    </div>
    <h1 class="barra-titulo">Substituições de perfis e acessórios</h1>
    <div class="barra-info">
      <time id="data-hora"></time>
      <button id="btn-tema" class="btn-tema" type="button" aria-label="Alternar tema"></button>
    </div>
  </header>

  <main class="painel-grade">
    <section class="painel" id="painel-perfis">
      <h2>Perfis</h2>
      <form class="busca" autocomplete="off">
        <label for="codigo-perfis">Digite o código do perfil</label>
        <div class="busca-campos">
          <input id="codigo-perfis" type="text" placeholder="Ex: CHR004" autocapitalize="characters" spellcheck="false" required>
          <button type="submit" class="btn btn-principal">Pesquisar</button>
          <button type="button" class="btn btn-secundario btn-limpar" hidden>Limpar</button>
        </div>
      </form>
      <div class="resultado" aria-live="polite"></div>
    </section>

    <section class="painel" id="painel-acessorios">
      <h2>Acessórios</h2>
      <form class="busca" autocomplete="off">
        <label for="codigo-acessorios">Digite o código do acessório/componente</label>
        <div class="busca-campos">
          <input id="codigo-acessorios" type="text" placeholder="Ex: GUI-004" autocapitalize="characters" spellcheck="false" required>
          <button type="submit" class="btn btn-principal">Pesquisar</button>
          <button type="button" class="btn btn-secundario btn-limpar" hidden>Limpar</button>
        </div>
      </form>
      <div class="resultado" aria-live="polite"></div>
    </section>
  </main>

  <footer class="rodape">
    Versão <span class="versao_atual"></span> · Moisés Muniz <br>
    <span id="contador-banco"></span>
  </footer>

  <script src="global.js"></script>
  <script src="js/script.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
