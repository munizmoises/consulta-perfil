<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Perfil | Catálogo Técnico</title>
  <meta name="description" content="Catálogo técnico de perfis de alumínio e acessórios da Perfil Alumínio do Brasil.">
  <meta property="og:title" content="Catálogo Técnico | Consulta Perfil">
  <meta property="og:description" content="Consulte o catálogo técnico de perfis de alumínio, acessórios e componentes de forma rápida.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://consultaperfil.com.br/catalogo">
  <meta property="og:image" content="https://consultaperfil.com.br/assets/img/favicon.png">
  <meta property="og:image:type" content="image/png">


  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/catalogo.css">
</head>

<body>
  <header class="barra" data-titulo="Catálogo técnico de perfis e acessórios"></header>

  <section class="pesquisa-geral">
    <form id="form-pesquisa-geral" class="pesquisa-geral-form" autocomplete="off">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="pesquisa-geral" type="search" placeholder="Pesquise do seu jeito: janela de correr 4 folhas, porta de giro, guarda-corpo..." spellcheck="false">
      <div class="filtro-tipologia" id="filtro-tipologia">
        <button type="button" class="filtro-tipologia-botao" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-layer-group"></i> Tipologias <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="filtro-tipologia-lista" hidden></div>
      </div>
      <button type="submit" class="btn btn-principal">Pesquisar</button>
    </form>
    <div id="pesquisa-geral-sugestoes" class="pesquisa-geral-sugestoes"></div>
    <div id="pesquisa-geral-resultado" class="pesquisa-geral-resultado" hidden></div>
  </section>

  <main class="catalogo-layout">
    <aside class="catalogo-sistemas painel">
      <h3 class="sistemas-titulo">Sistemas</h3>
      <div class="sistemas-lista" id="filtro-sistemas">
        <button type="button" class="sistema-btn sistema-btn-ativo" data-sistema="todos">Todos</button>
      </div>
    </aside>

    <!-- Abas / Busca visual e Histórico -->
    <section class="catalogo-busca-painel painel">
      <div class="catalogo-abas">
        <button class="catalogo-aba catalogo-aba-ativa" data-aba="perfis" type="button">Perfis</button>
        <button class="catalogo-aba" data-aba="acessorios" type="button">Acessórios</button>
      </div>

      <form class="busca" autocomplete="off" id="form-catalogo">
        <label for="busca-catalogo">Nome ou código</label>
        <div class="busca-campos-wrap">
          <div class="busca-input-container">
            <input id="busca-catalogo" type="text" placeholder="Ex: CHR057" spellcheck="false">
            <button type="button" class="btn-camera-ia" id="btn-camera-ia" title="Busca Visual" aria-label="Busca Visual">
              <i class="fa-solid fa-camera"></i>
            </button>
          </div>
          <button type="submit" class="btn btn-principal">Pesquisar</button>
          <button type="button" class="btn btn-secundario btn-limpar" hidden>Limpar</button>
        </div>
      </form>

      <div id="historico-container" class="historico-catalogo"></div>

      <div id="resultado-catalogo" class="resultado" aria-live="polite"></div>
    </section>

    <!-- Ficha Técnica -->
    <section class="catalogo-ficha painel" id="ficha-tecnica">
      <p class="ficha-vazia">Pesquise um código ou nome ao lado, ou selecione um sistema para listar os itens.</p>
    </section>
  </main>

  <footer class="rodape">
    Versão <span class="versao_atual"></span> · Moisés Muniz <br>
    <a class="site_perfil" href="https://perfilaluminio.com.br/" target="_blank">Conheça a Perfil Alumínio do Brasil</a> <br>
  </footer>

  <script src="global.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/three.min.js"></script>
  <script src="js/viewer3d.js"></script>
</body>
</html>
